name: utar_wifi_helper
description: "A new Flutter project for UTAR WiFi Auto-Login."
version: 1.0.2+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  network_info_plus: ^6.0.0
  connectivity_plus: ^6.0.0
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true

flutter:
  uses-material-design: true

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTAR Helper App - Master Admin Portal v3.0</title>
    <style>
        :root {
            --primary: #7C4DFF;
            --primary-variant: #651FFF;
            --bg: #0B0813;
            --surface: #171326;
            --card-bg: #211B35;
            --text-main: #F3EDF7;
            --text-sub: #AAA4B8;
            --accent-green: #00E676;
            --accent-red: #FF5252;
            --accent-yellow: #FFD600;
            --accent-cyan: #00E5FF;
            --border: #322A4E;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 270px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .brand-logo { font-size: 28px; }
        .brand-title { font-weight: bold; font-size: 16px; color: #E8DEF8; }

        .nav-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-sub);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .nav-item:hover, .nav-item.active {
            background: var(--card-bg);
            color: var(--text-main);
            border-left: 4px solid var(--primary);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        header {
            min-height: 70px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title { font-size: 18px; font-weight: bold; }
        .status-pill {
            background: rgba(0, 230, 118, 0.15);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .search-box {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #141218;
            color: white;
            font-size: 13px;
            width: 240px;
        }

        .content-body { padding: 30px; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }
        .stat-val { font-size: 28px; font-weight: bold; color: #D0BCFF; margin-top: 6px; }
        .stat-lbl { font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Cards & Lists */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 12px;
        }
        .badge {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .post-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }

        .media-preview {
            max-width: 100%;
            max-height: 360px;
            border-radius: 14px;
            margin-bottom: 16px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .action-row { display: flex; gap: 12px; flex-wrap: wrap; }

        button {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-approve { background: var(--accent-green); color: #003816; }
        .btn-reject { background: var(--accent-red); color: #3E0000; }
        .btn-export { background: var(--accent-cyan); color: #00363A; }
        .btn-delete { background: rgba(255, 82, 82, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        /* Login Modal */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 8, 19, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-box {
            width: 360px;
            text-align: center;
        }
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #141218;
            color: white;
            margin: 20px 0;
            box-sizing: border-box;
            font-size: 15px;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            header { padding: 15px; }
            .content-body { padding: 15px; }
        }
    </style>

    <!-- Firebase SDK v9 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            authDomain: "utarconfession-38b6b.firebaseapp.com",
            projectId: "utarconfession-38b6b",
            storageBucket: "utarconfession-38b6b.appspot.com",
            messagingSenderId: "1000000000",
            appId: "1:1000000000:web:dummy"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeTab = "pending";
        let rawPending = [], rawApproved = [], rawReports = [], rawFeedback = [];

        window.switchTab = (tabName) => {
            activeTab = tabName;
            document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
            document.getElementById("nav-" + tabName).classList.add("active");

            document.getElementById("sec-pending").style.display = tabName === "pending" ? "block" : "none";
            document.getElementById("sec-approved").style.display = tabName === "approved" ? "block" : "none";
            document.getElementById("sec-reports").style.display = tabName === "reports" ? "block" : "none";
            document.getElementById("sec-feedback").style.display = tabName === "feedback" ? "block" : "none";

            document.getElementById("page-title").innerText = tabName.toUpperCase() + " DASHBOARD";
            filterCurrentTab();
        };

        window.filterCurrentTab = () => {
            const term = document.getElementById("search-input").value.toLowerCase().trim();
            if (activeTab === "pending") renderPending(term);
            else if (activeTab === "approved") renderApproved(term);
            else if (activeTab === "reports") renderReports(term);
            else if (activeTab === "feedback") renderFeedback(term);
        };

        window.exportFeedbackCSV = () => {
            if (!rawFeedback.length) return alert("No feedback data to export.");
            let csv = "ID,Faculty Block,Can Connect WiFi,Content,Timestamp\n";
            rawFeedback.forEach(item => {
                const d = item.data;
                const content = `"${(d.content || '').replace(/"/g, '""')}"`;
                csv += `"${item.id}","${d.facultyBlock || ''}","${d.canConnectWifi ?? ''}",${content},"${new Date(Number(d.timestamp) || Date.now()).toLocaleString()}"\n`;
            });
            downloadCSV(csv, "utar_app_feedback_report.csv");
        };

        function downloadCSV(csvContent, filename) {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.approvePost = async (id) => {
            try {
                await updateDoc(doc(db, "confessions", id), { status: "APPROVED" });
                alert("✅ Post Approved! Published live to students' phones.");
            } catch(e) { alert("Error: " + e.message); }
        };

        window.rejectPost = async (id) => {
            if (confirm("Are you sure you want to reject and delete this post?")) {
                try {
                    await deleteDoc(doc(db, "confessions", id));
                    alert("🗑️ Post Deleted.");
                } catch(e) { alert("Error: " + e.message); }
            }
        };

        window.deleteDocument = async (collName, id) => {
            if (confirm("Delete this item permanently?")) {
                try {
                    await deleteDoc(doc(db, collName, id));
                    alert("Deleted successfully.");
                } catch(e) { alert("Error: " + e.message); }
            }
        };

        window.checkPassword = () => {
            const pass = document.getElementById("admin-pass").value;
            if (pass === "utaradmin123" || pass === "admin") {
                document.getElementById("login-modal").style.display = "none";
                initLiveData();
            } else {
                alert("Incorrect Admin Password!");
            }
        };

        function initLiveData() {
            // Live Pending Posts
            onSnapshot(query(collection(db, "confessions"), where("status", "==", "PENDING")), (snapshot) => {
                document.getElementById("cnt-pending").innerText = snapshot.size;
                rawPending = [];
                snapshot.forEach(docSnap => rawPending.push({ id: docSnap.id, data: docSnap.data() }));
                rawPending.sort((a, b) => (Number(b.data.timestamp) || 0) - (Number(a.data.timestamp) || 0));
                renderPending();
            });

            // Live Approved Posts
            onSnapshot(query(collection(db, "confessions")), (snapshot) => {
                let count = 0;
                rawApproved = [];
                snapshot.forEach(docSnap => {
                    const d = docSnap.data();
                    if ((d.status || "APPROVED") === "APPROVED") {
                        count++;
                        rawApproved.push({ id: docSnap.id, data: d });
                    }
                });
                rawApproved.sort((a, b) => (Number(b.data.timestamp) || 0) - (Number(a.data.timestamp) || 0));
                document.getElementById("cnt-approved").innerText = count;
                renderApproved();
            });

            // Live Reports
            onSnapshot(collection(db, "reports"), (snapshot) => {
                document.getElementById("cnt-reports").innerText = snapshot.size;
                rawReports = [];
                snapshot.forEach(docSnap => rawReports.push({ id: docSnap.id, data: docSnap.data() }));
                rawReports.sort((a, b) => (Number(b.data.timestamp) || 0) - (Number(a.data.timestamp) || 0));
                renderReports();
            });

            // Live Feedback
            onSnapshot(collection(db, "feedback"), (snapshot) => {
                rawFeedback = [];
                snapshot.forEach(docSnap => rawFeedback.push({ id: docSnap.id, data: docSnap.data() }));
                rawFeedback.sort((a, b) => (Number(b.data.timestamp) || 0) - (Number(a.data.timestamp) || 0));
                renderFeedback();
            });
        }

        function renderPending(term = "") {
            const container = document.getElementById("list-pending");
            container.innerHTML = "";
            const filtered = rawPending.filter(i => (i.data.content || '').toLowerCase().includes(term) || (i.data.category || '').toLowerCase().includes(term));
            if (!filtered.length) {
                container.innerHTML = "<div class='card'><p>🎉 No pending confessions matching criteria!</p></div>";
                return;
            }
            filtered.forEach(item => container.appendChild(createPostCard(item.id, item.data, true)));
        }

        function renderApproved(term = "") {
            const container = document.getElementById("list-approved");
            container.innerHTML = "";
            const filtered = rawApproved.filter(i => (i.data.content || '').toLowerCase().includes(term) || (i.data.category || '').toLowerCase().includes(term));
            if (!filtered.length) {
                container.innerHTML = "<div class='card'><p>No live approved posts matching criteria.</p></div>";
                return;
            }
            filtered.forEach(item => container.appendChild(createPostCard(item.id, item.data, false)));
        }

        function renderReports(term = "") {
            const container = document.getElementById("list-reports");
            container.innerHTML = "";
            const filtered = rawReports.filter(i => (i.data.reason || '').toLowerCase().includes(term) || (i.data.contentPreview || '').toLowerCase().includes(term));
            if (!filtered.length) {
                container.innerHTML = "<div class='card'><p>✅ Zero reported posts!</p></div>";
                return;
            }
            filtered.forEach(item => {
                const d = item.data;
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="meta-row">
                        <span>🚩 Reported Post #${d.confessionNumber || 1} • ${new Date(Number(d.timestamp) || Date.now()).toLocaleString()}</span>
                    </div>
                    <div class="post-text" style="color: var(--accent-red);"><strong>Reason:</strong> ${escapeHtml(d.reason || 'No reason specified')}</div>
                    <div class="post-text"><strong>Original Text:</strong> "${escapeHtml(d.contentPreview || '')}"</div>
                    <div class="action-row">
                        <button class="btn-delete" onclick="deleteDocument('reports', '${item.id}')">Dismiss Report 🗑️</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderFeedback(term = "") {
            const container = document.getElementById("list-feedback");
            container.innerHTML = "";

            const filtered = rawFeedback.filter(i => (i.data.content || '').toLowerCase().includes(term) || (i.data.facultyBlock || '').toLowerCase().includes(term));
            if (!filtered.length) {
                container.innerHTML = "<div class='card'><p>📝 No student feedback matching criteria.</p></div>";
                return;
            }

            // Summary Header with Export Button
            const summaryDiv = document.createElement("div");
            summaryDiv.className = "card";
            summaryDiv.style.background = "#191428";
            summaryDiv.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        <h4 style="margin: 0; color: #D0BCFF;">📊 Student Feedback & Campus Wi-Fi Reports (${filtered.length})</h4>
                        <p style="margin: 4px 0 0 0; font-size: 12px; color: var(--text-sub);">Review campus block Wi-Fi coverage reports submitted by students.</p>
                    </div>
                    <button class="btn-export" onclick="exportFeedbackCSV()">Export to CSV 📥</button>
                </div>
            `;
            container.appendChild(summaryDiv);

            filtered.forEach(item => {
                const d = item.data;
                const blockTag = d.facultyBlock ? ` • 📍 ${escapeHtml(d.facultyBlock)}` : '';
                const wifiStatusTag = d.canConnectWifi === true ? ' • WiFi: Yes ✅' : d.canConnectWifi === false ? ' • WiFi: No ❌' : '';
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="meta-row">
                        <span>📝 Student Feedback${blockTag}${wifiStatusTag} • ${new Date(Number(d.timestamp) || Date.now()).toLocaleString()}</span>
                    </div>
                    <div class="post-text">${escapeHtml(d.content || 'No text typed (Status report only)')}</div>
                    <div class="action-row">
                        <button class="btn-delete" onclick="deleteDocument('feedback', '${item.id}')">Delete Feedback 🗑️</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderPollHtml(poll) {
            if (!poll || !poll.question || !poll.options) return '';
            let optionsHtml = '';
            const totalVotes = (poll.voteCounts || []).reduce((a, b) => a + b, 0) || 1;

            (poll.options || []).forEach((opt, idx) => {
                const votes = (poll.voteCounts && poll.voteCounts[idx]) ? poll.voteCounts[idx] : 0;
                const pct = Math.round((votes / totalVotes) * 100);
                optionsHtml += `
                    <div style="background: rgba(124, 77, 255, 0.15); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-top: 6px; display: flex; justify-content: space-between; font-size: 13px;">
                        <span>✓ ${escapeHtml(opt)}</span>
                        <span style="font-weight: bold; color: var(--primary);">${pct}% (${votes} votes)</span>
                    </div>
                `;
            });

            return `
                <div style="background: #191428; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px;">
                    <div style="font-weight: bold; font-size: 14px; color: #D0BCFF; margin-bottom: 8px;">📊 Poll: ${escapeHtml(poll.question)}</div>
                    ${optionsHtml}
                </div>
            `;
        }

        function createPostCard(id, d, isPending) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div class="meta-row">
                    <span>#UTARConfession #${d.confessionNumber || 1} • ${new Date(Number(d.timestamp) || Date.now()).toLocaleString()}</span>
                    <span class="badge">${d.category || 'CAMPUS'}</span>
                </div>
                <div class="post-text">${escapeHtml(d.content || '')}</div>
                ${d.imageUrl ? `<img src="${d.imageUrl}" class="media-preview" />` : ''}
                ${renderPollHtml(d.poll)}
                <div class="action-row">
                    ${isPending ? `
                        <button class="btn-approve" onclick="approvePost('${id}')">Approve ✅</button>
                        <button class="btn-reject" onclick="rejectPost('${id}')">Reject & Delete ❌</button>
                    ` : `
                        <button class="btn-delete" onclick="rejectPost('${id}')">Delete Post 🗑️</button>
                    `}
                </div>
            `;
            return card;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</head>
<body>
    <!-- Login Password Gate -->
    <div id="login-modal" class="login-overlay">
        <div class="card login-box">
            <h2 style="color: #D0BCFF;">🛡️ UTAR Admin Portal</h2>
            <p style="color: var(--text-sub); font-size: 13px;">Enter Admin Password to manage app content:</p>
            <input type="password" id="admin-pass" placeholder="Admin Password (e.g. utaradmin123)" />
            <button class="btn-approve" style="width: 100%; justify-content: center;" onclick="checkPassword()">Login to Portal</button>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="brand">
            <span class="brand-logo">🎓</span>
            <div>
                <div class="brand-title">UTAR Master Portal</div>
                <div style="font-size: 11px; color: var(--text-sub);">Admin Control Center</div>
            </div>
        </div>

        <ul class="nav-list">
            <li id="nav-pending" class="nav-item active" onclick="switchTab('pending')">⏳ Pending Review</li>
            <li id="nav-approved" class="nav-item" onclick="switchTab('approved')">✅ Approved Posts</li>
            <li id="nav-reports" class="nav-item" onclick="switchTab('reports')">🚩 Student Reports</li>
            <li id="nav-feedback" class="nav-item" onclick="switchTab('feedback')">📝 App Feedback</li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <header>
            <div id="page-title" class="header-title">PENDING DASHBOARD</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <input type="text" id="search-input" class="search-box" placeholder="🔍 Search dashboard..." oninput="filterCurrentTab()" />
                <span class="status-pill">● Live Firestore Sync</span>
            </div>
        </header>

        <div class="content-body">
            <!-- Stats Row -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-lbl">Pending Review</div>
                    <div id="cnt-pending" class="stat-val" style="color: var(--accent-yellow);">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-lbl">Live Approved Posts</div>
                    <div id="cnt-approved" class="stat-val" style="color: var(--accent-green);">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-lbl">Reported Posts</div>
                    <div id="cnt-reports" class="stat-val" style="color: var(--accent-red);">0</div>
                </div>
            </div>

            <!-- Tab Sections -->
            <div id="sec-pending">
                <div id="list-pending"></div>
            </div>

            <div id="sec-approved" style="display: none;">
                <div id="list-approved"></div>
            </div>

            <div id="sec-reports" style="display: none;">
                <div id="list-reports"></div>
            </div>

            <div id="sec-feedback" style="display: none;">
                <div id="list-feedback"></div>
            </div>
        </div>
    </div>
</body>
</html>
